services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_ledger
      POSTGRES_PASSWORD: mini_ledger
      POSTGRES_DB: mini_ledger
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mini_ledger -d mini_ledger']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ['app']
    build:
      context: .
      target: development
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://mini_ledger:mini_ledger@postgres:5432/mini_ledger?schema=public
      PORT: 3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

volumes:
  postgres_data:
